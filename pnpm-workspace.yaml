  - '@rollup/rollup-linux-arm64-gnu@4.66.0'
  - '@rollup/rollup-linux-arm64-musl@4.66.0'
  - '@rollup/rollup-linux-loong64-gnu@4.66.0'
  - '@rollup/rollup-linux-loong64-musl@4.66.0'
